<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A45"/>
      <stop offset="100%" stop-color="#FF9D6C"/>
    </linearGradient>
    <linearGradient id="gradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4F72"/>
      <stop offset="100%" stop-color="#2E6DA4"/>
    </linearGradient>
  </defs>

  <!-- Icon: two interlocking rings symbolizing "jodo" (join/connect) -->
  <g transform="translate(30,40)">
    <circle cx="45" cy="60" r="42" fill="none" stroke="url(#gradB)" stroke-width="14"/>
    <circle cx="95" cy="60" r="42" fill="none" stroke="url(#gradA)" stroke-width="14"/>
  </g>

  <!-- Wordmark -->
  <text x="205" y="95" font-family="'Poppins','Segoe UI',Arial,sans-serif" font-size="58" font-weight="700" fill="#1B4F72">
    Jodo<tspan fill="#FF7A45">Fund</tspan>
  </text>

  <!-- Tagline -->
  <text x="207" y="130" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="400" letter-spacing="1.5" fill="#5A6B7A">
    CONNECT. CONTRIBUTE. CHANGE.
  </text>
</svg>
